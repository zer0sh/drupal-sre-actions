name: 'Composer Security Audit and Advisories'
description: 'Audits PHP and Drupal dependencies for security advisories (CVEs) and abandoned packages.'
author: 'Zero'

inputs:
  working-directory:
    description: 'Path to directory containing composer.json'
    required: false
    default: '.'
  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.2'
  fail-on-vulnerability:
    description: 'Fail the step if security advisories are detected'
    required: false
    default: 'true'
  abandoned:
    description: 'Policy for abandoned packages: fail, report, ignore'
    required: false
    default: 'report'

outputs:
  has-vulnerabilities:
    description: 'True if security vulnerabilities were detected'
    value: ${{ steps.audit.outputs.has_vulnerabilities }}
  vulnerabilities-count:
    description: 'Number of reported CVEs'
    value: ${{ steps.audit.outputs.vulnerabilities_count }}

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        tools: composer:v2
        coverage: none

    - name: Execute composer audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SUMMARY_FILE="/tmp/composer_audit_report.md"
        AUDIT_JSON="/tmp/composer_audit.json"

        echo "### Composer Security Audit Report" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        composer audit --format=json --abandoned=${{ inputs.abandoned }} > "$AUDIT_JSON" 2>&1 || true

        python3 -c '
        import json, sys

        summary_path = "'"$SUMMARY_FILE"'"
        json_path = "'"$AUDIT_JSON"'"

        try:
            with open(json_path, "r") as f:
                data = json.load(f)
        except Exception:
            data = {}

        advisories = data.get("advisories", {})
        abandoned = data.get("abandoned", {})
        total_vulns = sum(len(items) for items in advisories.values())

        with open(summary_path, "a") as f:
            if total_vulns > 0:
                f.write(f"**Alert:** Found {total_vulns} security vulnerabilities.\n\n")
                f.write("| Package | Advisory / CVE | Title | Link |\n")
                f.write("|---------|----------------|-------|------|\n")
                for pkg, items in advisories.items():
                    for item in items:
                        cve = item.get("cve") or item.get("advisoryId") or "N/A"
                        title = item.get("title", "").replace("|", "-")
                        link = item.get("link", "")
                        f.write(f"| `{pkg}` | `{cve}` | {title} | [Details]({link}) |\n")
                f.write("\n")
            else:
                f.write("No known security vulnerabilities reported by Composer advisory feeds.\n\n")

            if abandoned:
                f.write(f"**Abandoned Packages ({len(abandoned)}):**\n\n")
                f.write("| Package | Suggested Replacement |\n")
                f.write("|---------|-----------------------|\n")
                for pkg, repl in abandoned.items():
                    f.write(f"| `{pkg}` | `{repl or 'None'}` |\n")
                f.write("\n")

        with open("'"$GITHUB_OUTPUT"'", "a") as out:
            out.write(f"has_vulnerabilities={'true' if total_vulns > 0 else 'false'}\n")
            out.write(f"vulnerabilities_count={total_vulns}\n")
        '

        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.fail-on-vulnerability }}" == "true" ] && grep -q 'has_vulnerabilities=true' "$GITHUB_OUTPUT"; then
          echo "::error::Security vulnerabilities found in dependencies. Run composer audit locally to resolve."
          exit 1
        fi
