name: 'Drupal Pending Updates and Security Status Check'
description: 'Checks for pending Drupal core/contrib releases, security updates, and pending database updates (hook_update_N).'
author: 'Zero'

inputs:
  working-directory:
    description: 'Path to directory containing composer.json'
    required: false
    default: '.'
  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.2'
  drush-binary:
    description: 'Path to Drush binary'
    required: false
    default: 'vendor/bin/drush'
  check-security-only:
    description: 'Only report security-related module updates'
    required: false
    default: 'false'
  fail-on-security-updates:
    description: 'Fail the step if security updates are pending'
    required: false
    default: 'true'
  fail-on-pending-db-updates:
    description: 'Fail the step if database updates (hook_update_N) are pending'
    required: false
    default: 'false'

outputs:
  security-updates-count:
    description: 'Number of pending security updates'
    value: ${{ steps.check-updates.outputs.security_updates_count }}
  outdated-packages-count:
    description: 'Number of outdated Drupal packages'
    value: ${{ steps.check-updates.outputs.outdated_packages_count }}
  pending-db-updates-count:
    description: 'Number of pending database updates'
    value: ${{ steps.check-updates.outputs.pending_db_updates_count }}
  has-pending-updates:
    description: 'True if any updates are pending'
    value: ${{ steps.check-updates.outputs.has_pending_updates }}

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        tools: composer:v2
        coverage: none

    - name: Check pending package and database updates
      id: check-updates
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SUMMARY_FILE="/tmp/drupal_pending_updates_report.md"
        OUTDATED_JSON="/tmp/composer_outdated.json"
        echo "### Drupal Update Status and Security Report" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        echo "Checking outdated Composer packages..."
        composer outdated --direct --format=json > "$OUTDATED_JSON" 2>/dev/null || true

        # Check pending database updates via Drush if available
        DRUSH="${{ inputs.drush-binary }}"
        DB_UPDATES_JSON="/tmp/drush_db_updates.json"
        PENDING_DB_COUNT=0

        if [ -x "$DRUSH" ] && $DRUSH status --field=bootstrap 2>/dev/null | grep -q "Successful"; then
          echo "Drush is active. Checking pending database updates..."
          $DRUSH updatedb:status --format=json > "$DB_UPDATES_JSON" 2>/dev/null || echo "[]" > "$DB_UPDATES_JSON"
          PENDING_DB_COUNT=$(python3 -c '
        import json, sys
        try:
            with open("'"$DB_UPDATES_JSON"'") as f:
                data = json.load(f)
            print(len(data) if isinstance(data, list) else 0)
        except Exception:
            print(0)
        ')
        else
          echo "Drush not bootstrapped. Skipping database hook_update_N check."
          echo "[]" > "$DB_UPDATES_JSON"
        fi

        # Parse Composer outdated JSON and build SRE report
        python3 "${{ github.action_path }}/parse_updates.py" "$SUMMARY_FILE" "$OUTDATED_JSON" "$PENDING_DB_COUNT" "$GITHUB_OUTPUT"

        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.fail-on-pending-db-updates }}" == "true" ] && [ "$PENDING_DB_COUNT" -gt 0 ]; then
          echo "::error::Pending database updates detected ($PENDING_DB_COUNT). Run drush updb."
          exit 1
        fi
