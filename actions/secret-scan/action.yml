name: 'Secret Leak Detection'
description: 'SRE security gate preventing hardcoded credentials, tokens, and private keys from leaking into version control.'
author: 'Zero'

inputs:
  working-directory:
    description: 'Path to repository root'
    required: false
    default: '.'
  fail-on-secrets:
    description: 'Fail the step if secrets or high-entropy credentials are detected'
    required: false
    default: 'true'

outputs:
  secrets-detected:
    description: 'True if potential secrets or credentials were found'
    value: ${{ steps.scan.outputs.secrets_detected }}

runs:
  using: 'composite'
  steps:
    - name: Run TruffleHog / Gitleaks credential scanner
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SUMMARY_FILE="/tmp/secret_scan_report.md"
        echo "### Secret Leak Prevention Report" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        echo "Installing Gitleaks binary..."
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) GITLEAKS_ARCH="x64" ;;
          aarch64) GITLEAKS_ARCH="arm64" ;;
          *) GITLEAKS_ARCH="x64" ;;
        esac

        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_${GITLEAKS_ARCH}.tar.gz" | tar -xz -C /tmp gitleaks 2>/dev/null || true

        if [ -x "/tmp/gitleaks" ]; then
          REPORT_FILE="/tmp/gitleaks-report.json"
          /tmp/gitleaks detect --source=. --no-git --report-path="$REPORT_FILE" --report-format=json --exit-code=0 || true
          python3 "${{ github.action_path }}/scan.py" gitleaks "$SUMMARY_FILE" "$REPORT_FILE" "$GITHUB_OUTPUT"
        else
          echo "Fallback to internal regex scan for secrets..."
          python3 "${{ github.action_path }}/scan.py" fallback "$SUMMARY_FILE" "$GITHUB_OUTPUT"
        fi

        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.fail-on-secrets }}" == "true" ] && grep -q 'secrets_detected=true' "$GITHUB_OUTPUT"; then
          echo "::error::Credentials or secrets detected in repository! Revoke and remove immediately."
          exit 1
        fi
